name: MacControlMCP
options:
  bundleIdPrefix: com.nuclearcyborg.maccontrol
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_NAME: "$(TARGET_NAME)"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_ALLOWED: "NO"
    # The "Verify version" pre-build phase greps AppVersion.swift and the module header-copy steps
    # write into the build's include dir; user-script sandboxing (default-on under some xcodebuild
    # invocations, e.g. the MCP build server) denies both. These scripts only touch this repo and the
    # build's own products, so turn the sandbox off rather than enumerate every input/output file.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # Native-bundle version. Keep in lockstep with AppVersion.swift (the compiled-in source of
    # truth every target reports); the "Verify version" pre-build phase fails the build on drift.
    MARKETING_VERSION: "0.2.45"
    CURRENT_PROJECT_VERSION: "47"
    # Identifier suffix for the build variant. Empty is the /Applications build; the wheel's
    # ~/Applications build passes ".user" so it is a genuinely different product rather than a
    # second copy contending for one LaunchAgent Label and Mach service. Set it and the compiled-in
    # constants together via scripts/gen-identity.sh, which prints the value to pass here.
    IDENTITY_SUFFIX: ""

targets:
  MacControlMCPCore:
    type: library.static
    platform: macOS
    sources: [Sources/MacControlMCPCore]
    preBuildScripts:
      # Verifies, never regenerates. BuildStamp.swift and AppIdentity.swift are generated and
      # gitignored, so a fresh clone has neither — and xcodegen enumerates this directory when it
      # generates the project, so a missing file is absent from the TARGET, not just from disk.
      # Regenerating here cannot put it back in the compile list; it can only mask the real cause
      # or, worse, overwrite the identity the caller asked for with a different one.
      #
      # So this fails early with the actionable message instead, and additionally catches the
      # compiled-in identity disagreeing with the identifiers this build is producing — which is
      # precisely the silent mismatch the two-variant split exists to prevent.
      - name: Verify generated sources and identity
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT"
          for generated in Sources/MacControlMCPCore/AppIdentity.swift \
                           Sources/MacControlMCPCore/BuildStamp.swift \
                           Generated/host.launchagent.plist; do
            if [ ! -f "$generated" ]; then
              echo "error: $generated is missing. Run ./scripts/generate.sh — a bare 'xcodegen generate' leaves the generated sources out of the target."
              exit 1
            fi
          done
          EXPECTED="com.nuclearcyborg.maccontrol${IDENTITY_SUFFIX}"
          ACTUAL=$(grep -oE 'appBundleID = "[^"]+"' Sources/MacControlMCPCore/AppIdentity.swift | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "error: identity drift — AppIdentity.swift says '$ACTUAL' but IDENTITY_SUFFIX makes this build '$EXPECTED'. Run ./scripts/generate.sh --variant system|user."
            exit 1
          fi
          # The suffix appends to each COMPLETE identifier, so the host is "<base>.host<suffix>",
          # not "<app id>.host".
          EXPECTED_LABEL="com.nuclearcyborg.maccontrol.host${IDENTITY_SUFFIX}"
          LABEL=$(/usr/libexec/PlistBuddy -c 'Print :Label' Generated/host.launchagent.plist)
          if [ "$LABEL" != "$EXPECTED_LABEL" ]; then
            echo "error: identity drift — the LaunchAgent label is '$LABEL', expected '$EXPECTED_LABEL'. Run ./scripts/generate.sh --variant system|user."
            exit 1
          fi

  AXKit:
    type: library.static
    platform: macOS
    sources: [Sources/AXKit]
    dependencies:
      - target: MacControlMCPCore

  CaptureKit:
    type: library.static
    platform: macOS
    sources: [Sources/CaptureKit]
    dependencies:
      - target: MacControlMCPCore

  InputKit:
    type: library.static
    platform: macOS
    sources: [Sources/InputKit]
    dependencies:
      - target: MacControlMCPCore

  HostKit:
    type: library.static
    platform: macOS
    sources: [Sources/HostKit]
    dependencies:
      - target: MacControlMCPCore
      - target: AXKit
      - target: CaptureKit
      - target: InputKit

  # Same sources as the SPM executable `MacControlMCP` (Package.swift); named differently
  # because the project and MacControlApp's PRODUCT_NAME already claim "MacControlMCP".
  # AXProbe is deliberately SPM-only. Keep dependencies in sync with Package.swift by hand.
  MacControlStdio:
    type: tool
    platform: macOS
    sources: [Sources/MacControlMCP]
    dependencies:
      - target: HostKit
      - target: AXKit
      - target: CaptureKit
      - target: InputKit
      - target: MacControlMCPCore

  MacControlHost:
    type: application
    platform: macOS
    sources: [Sources/MacControlHost]
    info:
      path: Generated/MacControlHost-Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: MacControlHost
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nuclearcyborg.maccontrol.host$(IDENTITY_SUFFIX)
    dependencies:
      - target: HostKit
      - target: AXKit
      - target: CaptureKit
      - target: InputKit
      - target: MacControlMCPCore

  MacControlRelay:
    type: tool
    platform: macOS
    sources: [Sources/MacControlRelay]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nuclearcyborg.maccontrol.relay$(IDENTITY_SUFFIX)
    dependencies:
      - target: HostKit
      - target: AXKit
      - target: CaptureKit
      - target: InputKit
      - target: MacControlMCPCore

  MacControlRegistrar:
    type: tool
    platform: macOS
    sources: [Sources/MacControlRegistrar]
    dependencies:
      # For AppIdentity: the LaunchAgent it registers must be this build's variant, not a
      # hardcoded name that only matches the /Applications build.
      - target: MacControlMCPCore

  MacControlApp:
    type: application
    platform: macOS
    sources: [Sources/MacControlApp]
    info:
      path: Generated/MacControlMCP-Info.plist
      properties:
        CFBundleName: MacControlMCP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_NAME: MacControlMCP
        PRODUCT_BUNDLE_IDENTIFIER: com.nuclearcyborg.maccontrol$(IDENTITY_SUFFIX)
    dependencies:
      - target: MacControlHost
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: MacControlRelay
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: HostKit
      - target: AXKit
      - target: CaptureKit
      - target: InputKit
      - target: MacControlMCPCore
    preBuildScripts:
      - name: Verify version
        basedOnDependencyAnalysis: false
        script: |
          # Keep marketing version AND build number in lockstep between project.yml (the bundle
          # Info.plists) and AppVersion.swift (what every component reports at runtime / over MCP).
          # scripts/bump-version.sh advances both together on each install; this guards a hand-edit
          # that touched only one.
          APPVER="${SRCROOT}/Sources/MacControlMCPCore/AppVersion.swift"
          SWIFT_MARKETING=$(grep -oE 'marketingVersion = "[^"]+"' "$APPVER" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          SWIFT_BUILD=$(grep -oE 'buildNumber = "[^"]+"' "$APPVER" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$SWIFT_MARKETING" != "$MARKETING_VERSION" ] || [ "$SWIFT_BUILD" != "$CURRENT_PROJECT_VERSION" ]; then
            echo "error: version drift — AppVersion.swift is $SWIFT_MARKETING ($SWIFT_BUILD) but project.yml is $MARKETING_VERSION ($CURRENT_PROJECT_VERSION). Set both to the same value."
            exit 1
          fi
    postCompileScripts:
      - name: Copy LaunchAgent plist
        inputFiles:
          - $(SRCROOT)/Generated/host.launchagent.plist
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/com.nuclearcyborg.maccontrol.host.plist
        script: |
          DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchAgents"
          mkdir -p "$DEST"
          # Generated by scripts/gen-identity.sh for the variant being built; its Label and Mach
          # service carry the identity suffix, while the FILE NAME stays constant (SMAppService
          # resolves it inside the calling app's own bundle, so it needs no suffix).
          cp "${SRCROOT}/Generated/host.launchagent.plist" "$DEST/com.nuclearcyborg.maccontrol.host.plist"

  MacControlMCPCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/MacControlMCPCoreTests]
    dependencies:
      - target: MacControlMCPCore

  AXKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/AXKitTests]
    dependencies:
      - target: AXKit
      - target: MacControlMCPCore

  CaptureKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/CaptureKitTests]
    dependencies:
      - target: CaptureKit
      - target: MacControlMCPCore

  InputKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/InputKitTests]
    dependencies:
      - target: InputKit
      - target: MacControlMCPCore

  HostKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/HostKitTests]
    dependencies:
      - target: HostKit
      - target: AXKit
      - target: CaptureKit
      - target: InputKit
      - target: MacControlMCPCore

schemes:
  All:
    build:
      targets:
        MacControlApp: all
        MacControlStdio: all
        MacControlHost: all
        MacControlRelay: all
        MacControlRegistrar: all
        MacControlMCPCoreTests: [test]
        AXKitTests: [test]
        CaptureKitTests: [test]
        InputKitTests: [test]
        HostKitTests: [test]
    test:
      targets:
        - MacControlMCPCoreTests
        - AXKitTests
        - CaptureKitTests
        - InputKitTests
        - HostKitTests
      gatherCoverageData: false

  Release:
    build:
      targets:
        MacControlApp: all
    run:
      config: Release
    archive:
      config: Release
