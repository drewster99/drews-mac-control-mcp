[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drews-mac-control-mcp"
version = "0.2.38"
description = "An MCP server that lets an LLM drive macOS apps and the iOS Simulator, delivered as a signed macOS app."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "Andrew Benson", email = "db@nuclearcyborg.com" }]
license = { text = "Apache-2.0" }
keywords = ["mcp", "model-context-protocol", "macos", "accessibility", "automation", "ios-simulator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/drewster99/drews-mac-control-mcp"
Source = "https://github.com/drewster99/drews-mac-control-mcp"
Issues = "https://github.com/drewster99/drews-mac-control-mcp/issues"

[project.scripts]
drews-mac-control-mcp = "drews_mac_control_mcp.bootstrap:main"

[tool.setuptools]
packages = ["drews_mac_control_mcp"]
include-package-data = true

[tool.setuptools.package-data]
drews_mac_control_mcp = ["resources/*.zip"]
